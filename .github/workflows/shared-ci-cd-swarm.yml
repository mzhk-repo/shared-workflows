name: Shared CI/CD Pipeline (Swarm + SOPS)

on:
  workflow_call:
    inputs:
      environment_name:
        description: 'Назва середовища (наприклад, production, development)'
        required: false
        type: string
        default: 'development'
      deploy:
        description: 'Чи запускати деплой (true/false)'
        required: false
        type: boolean
        default: true
      build_and_push_docker:
        description: 'Чи будувати і пушити Docker-образ у GHCR'
        required: false
        type: boolean
        default: false
      push_docker_image:
        description: 'Чи пушити Docker-образ навіть якщо deploy=false'
        required: false
        type: boolean
        default: false
      docker_image_name:
        description: 'Назва Docker-образу (наприклад, my-app)'
        required: false
        type: string
      validation_script_path:
        description: 'Опційний relative path до caller-specific validation script'
        required: false
        type: string
        default: ''
      orchestration_script_path:
        description: 'Опційний шлях до локального скрипта-оркестратора в репозиторії (виконується на сервері перед deploy)'
        required: false
        type: string
        default: 'scripts/deploy-orchestrator.sh'
      infra_repo_path:
        description: 'Шлях до Ansible інфраструктурного репозиторію на віддаленому сервері'
        required: false
        type: string
        default: '/opt/Ansible'
      resolved_image_digest:
        description: 'Опційний immutable image reference IMAGE@sha256:... для передачі в remote env contract'
        required: false
        type: string
        default: ''
      declared_deploy_ref:
        description: 'Опційний exact control-plane Git SHA для remote checkout замість caller SHA'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'Опційний vX.Y.Z tag, який вмикає immutable release evidence'
        required: false
        type: string
        default: ''
      deployment_release_tag:
        description: 'Опційний vX.Y.Z tag для remote production deployment contract'
        required: false
        type: string
        default: ''
      control_plane_sha:
        description: 'Опційний exact control-plane SHA для release evidence'
        required: false
        type: string
        default: ''
      approval_context:
        description: 'Опційний reviewed approval identifier for remote production deployment'
        required: false
        type: string
        default: ''
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      SERVER_HOST:
        required: false
      SERVER_USER:
        required: false
      SERVER_SSH_KEY:
        required: false
      SERVER_SSH_PORT:
        required: false
      SSH_HOST_KEY_PUB:
        required: false
      DEPLOY_PROJECT_DIR:
        required: false
      SOPS_AGE_KEY:
        required: false

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-checks-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      pull-requests: read
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run caller validation script
        if: inputs.validation_script_path != ''
        env:
          VALIDATION_SCRIPT_PATH: ${{ inputs.validation_script_path }}
        run: |
          set -euo pipefail
          [[ "${VALIDATION_SCRIPT_PATH}" != /* && "${VALIDATION_SCRIPT_PATH}" != *'..'* ]] || { echo 'ERROR: validation_script_path must be a safe relative path'; exit 1; }
          [[ -f "${VALIDATION_SCRIPT_PATH}" && ! -L "${VALIDATION_SCRIPT_PATH}" ]] || { echo 'ERROR: validation script is missing or unsafe'; exit 1; }
          bash "${VALIDATION_SCRIPT_PATH}"

      - name: Run Actionlint
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" rhysd/actionlint@sha256:f70fe2789baa8fe077577f1de2e0951171c62913ac4efcadcf7603bcf5008ab5 -color /repo/.github/workflows/*.yml

      - name: Run Hadolint on Dockerfiles
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \( -name 'Dockerfile' -o -name '*.Dockerfile' \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Dockerfiles found, skipping hadolint"
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Linting $file"
            docker run --rm -i hadolint/hadolint@sha256:9259e253a4e299b50c92006149dd3a171c7ea3c5bd36f060022b5d2c1ff0fbbe hadolint - < "$file"
          done

      - name: Run Gitleaks
        run: |
          config_arg=""
          if [[ -f ".gitleaks.toml" ]]; then
            config_arg="--config=/repo/.gitleaks.toml"
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks@sha256:bf00b5e039f0fad4b32935dc5ec1e358f227ccd097bcb64b971f0331072fe2ae \
            detect --source=/repo --redact -v --exit-code=1 $config_arg

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          exit-code: '1'

      - name: Print Trivy report
        if: always()
        shell: bash
        run: |
          if [[ -f trivy-report.txt ]]; then
            echo "Trivy report:"
            cat trivy-report.txt
          else
            echo "Trivy did not generate a report file."
          fi

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: trivy-report-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.environment_name }}
          path: trivy-report.txt
          if-no-files-found: warn

      - name: Detect compose file
        id: compose
        run: |
          if [[ -f "docker-compose.yaml" ]]; then
            echo "file=docker-compose.yaml" >> "$GITHUB_OUTPUT"
          elif [[ -f "docker-compose.yml" ]]; then
            echo "file=docker-compose.yml" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare env file for compose validation
        if: hashFiles('.env.example') != ''
        run: cp .env.example .env

      - name: Validate compose config
        if: steps.compose.outputs.file != ''
        env:
          COMPOSE_FILE: ${{ steps.compose.outputs.file }}
        run: docker compose -f "${COMPOSE_FILE}" config --quiet

      - name: Log in to GitHub Container Registry
        if: inputs.build_and_push_docker == true && (inputs.deploy || inputs.push_docker_image)
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: inputs.build_and_push_docker == true
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.docker_image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build
        if: inputs.build_and_push_docker == true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ inputs.deploy || inputs.push_docker_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release-evidence:
    name: Release evidence
    if: inputs.release_tag != '' && inputs.build_and_push_docker == true
    needs: ci-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate release metadata
        env:
          TAG: ${{ inputs.release_tag }}
          CONTROL_PLANE_SHA: ${{ inputs.control_plane_sha }}
          DIGEST: ${{ needs.ci-checks.outputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${CONTROL_PLANE_SHA}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          test -f "release/${TAG}.json"
          # shellcheck disable=SC2016
          # JavaScript uses process.env; shell expansion must stay disabled.
          node -e 'const m=require(`./release/${process.env.TAG}.json`); const p=require("./package.json"); if (m.version !== process.env.TAG || `v${p.version}` !== process.env.TAG || m.upstream?.tag !== "v1.1.5" || !/^[a-f0-9]{40}$/.test(m.upstream?.commit || "") || m.control_plane?.sha !== process.env.CONTROL_PLANE_SHA) process.exit(1)'
      - name: Resolve immutable image reference
        id: image
        env:
          DIGEST: ${{ needs.ci-checks.outputs.image_digest }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ inputs.docker_image_name }}
        run: |
          set -euo pipefail
          printf 'reference=ghcr.io/%s/%s@%s\n' "${IMAGE_OWNER}" "${IMAGE_NAME}" "${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Generate exact-digest Trivy report
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          format: json
          output: trivy-${{ inputs.release_tag }}.json
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.reference }}
          format: cyclonedx-json
          output-file: sbom-${{ inputs.release_tag }}.cdx.json
      - name: Create evidence checksums
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          CONTROL_PLANE_SHA: ${{ inputs.control_plane_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          sha256sum "trivy-${RELEASE_TAG}.json" "sbom-${RELEASE_TAG}.cdx.json" > SHA256SUMS
          printf 'image=%s\ncontrol_plane_sha=%s\nbuild_sha=%s\n' "$IMAGE" "$CONTROL_PLANE_SHA" "$GITHUB_SHA" > release-evidence.env
          cat SHA256SUMS >> release-evidence.env
      - name: Refuse release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1
      - name: Publish immutable release evidence
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: false
          files: |
            trivy-${{ inputs.release_tag }}.json
            sbom-${{ inputs.release_tag }}.cdx.json
            SHA256SUMS
            release-evidence.env

  cd-deploy:
    name: cd-deploy
    needs: [ci-checks, release-evidence]
    if: always() && inputs.deploy == true && needs.ci-checks.result == 'success' && (inputs.release_tag == '' || needs.release-evidence.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cd-deploy-${{ inputs.environment_name }}
      cancel-in-progress: false
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate required secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST_KEY_PUB: ${{ secrets.SSH_HOST_KEY_PUB }}
          DEPLOY_PROJECT_DIR: ${{ secrets.DEPLOY_PROJECT_DIR }}
        run: |
          set -euo pipefail
          for key in SERVER_HOST SERVER_USER SERVER_SSH_KEY SSH_HOST_KEY_PUB DEPLOY_PROJECT_DIR; do
            if [[ -z "${!key:-}" ]]; then
              echo "ERROR: required secret is missing: $key"
              echo "HINT: check repo/environment secrets and organization secret visibility for this repository"
              exit 1
            fi
          done

      - name: Validate optional immutable deployment inputs
        env:
          RESOLVED_IMAGE_DIGEST: ${{ inputs.resolved_image_digest }}
          DECLARED_DEPLOY_REF: ${{ inputs.declared_deploy_ref }}
          DEPLOYMENT_RELEASE_TAG: ${{ inputs.deployment_release_tag }}
          APPROVAL_CONTEXT: ${{ inputs.approval_context }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          DEPLOY_ENABLED: ${{ inputs.deploy }}
        run: |
          set -euo pipefail
          if [[ -n "${RESOLVED_IMAGE_DIGEST}" && ! "${RESOLVED_IMAGE_DIGEST}" =~ ^[^[:space:]@]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "ERROR: resolved_image_digest must be IMAGE@sha256:DIGEST"
            exit 1
          fi
          if [[ -n "${DECLARED_DEPLOY_REF}" && ! "${DECLARED_DEPLOY_REF}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "ERROR: declared_deploy_ref must be a 40-character SHA"
            exit 1
          fi
          if [[ "${ENVIRONMENT_NAME}" == "production" && "${DEPLOY_ENABLED}" == "true" ]]; then
            [[ "${RESOLVED_IMAGE_DIGEST}" =~ ^[^[:space:]@]+@sha256:[a-f0-9]{64}$ ]] || { echo 'ERROR: production deploy requires resolved_image_digest'; exit 1; }
            [[ "${DEPLOYMENT_RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'ERROR: production deploy requires deployment_release_tag'; exit 1; }
            [[ "${DECLARED_DEPLOY_REF}" =~ ^[a-f0-9]{40}$ ]] || { echo 'ERROR: production deploy requires declared_deploy_ref'; exit 1; }
            [[ "${APPROVAL_CONTEXT}" =~ ^[A-Za-z0-9][A-Za-z0-9_.:-]{7,127}$ ]] || { echo 'ERROR: production deploy requires approval_context'; exit 1; }
          fi

      - name: Configure SSH key and known_hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SSH_HOST_KEY_PUB: ${{ secrets.SSH_HOST_KEY_PUB }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          umask 177
          ssh_port="${SERVER_SSH_PORT:-22}"
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          if [[ "${ssh_port}" == "22" ]]; then
            printf '%s %s\n' "$SERVER_HOST" "$SSH_HOST_KEY_PUB" > ~/.ssh/known_hosts
          else
            printf '[%s]:%s %s\n' "$SERVER_HOST" "$ssh_port" "$SSH_HOST_KEY_PUB" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Validate required SOPS secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SOPS_AGE_KEY:-}" ]]; then
            echo "ERROR: required secret is missing: SOPS_AGE_KEY"
            exit 1
          fi
          if [[ "${SOPS_AGE_KEY}" == age1* ]]; then
            echo "ERROR: SOPS_AGE_KEY looks like a public recipient (age1...), expected private key (AGE-SECRET-KEY-...)"
            exit 1
          fi
          if ! grep -q "AGE-SECRET-KEY-" <<< "${SOPS_AGE_KEY}"; then
            echo "ERROR: SOPS_AGE_KEY does not contain AGE private key material"
            exit 1
          fi

      - name: Install SOPS and age
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.10.2/sops-v3.10.2.linux.amd64 -o /tmp/sops
          chmod +x /tmp/sops
          sudo mv /tmp/sops /usr/local/bin/sops

          curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz -o /tmp/age.tar.gz
          tar -xzf /tmp/age.tar.gz -C /tmp
          sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          rm -rf /tmp/age /tmp/age.tar.gz

          sops --version
          age --version

      - name: Decrypt env file with SOPS
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        run: |
          set -euo pipefail
          case "${ENVIRONMENT_NAME}" in
            development|dev)
              ENC_FILE="env.dev.enc"
              ;;
            production|prod)
              ENC_FILE="env.prod.enc"
              ;;
            *)
              echo "ERROR: unsupported environment_name='${ENVIRONMENT_NAME}'"
              exit 1
              ;;
          esac

          if [[ ! -f "${ENC_FILE}" ]]; then
            echo "ERROR: encrypted env file not found: ${ENC_FILE}"
            exit 1
          fi

          private_key="$(printf '%s\n' "${SOPS_AGE_KEY}" | tr -d '\r' | awk '/^AGE-SECRET-KEY-/{print; exit}')"
          if [[ -z "${private_key}" ]]; then
            echo "ERROR: unable to parse AGE private key from SOPS_AGE_KEY"
            exit 1
          fi

          secret_public_key="$(printf '%s\n' "${private_key}" | age-keygen -y)"
          mapfile -t recipients < <(grep -E '^sops_age__list_[0-9]+__map_recipient=' "${ENC_FILE}" | cut -d= -f2-)
          if [[ ${#recipients[@]} -gt 0 ]]; then
            if ! printf '%s\n' "${recipients[@]}" | grep -Fxq "${secret_public_key}"; then
              echo "ERROR: SOPS_AGE_KEY does not match recipients in ${ENC_FILE}"
              echo "Secret public key: ${secret_public_key}"
              echo "File recipients:"
              printf '  - %s\n' "${recipients[@]}"
              exit 1
            fi
          fi

          key_file="/tmp/sops-age-key.txt"
          printf '%s\n' "${SOPS_AGE_KEY}" | tr -d '\r' > "${key_file}"
          chmod 600 "${key_file}"
          SOPS_AGE_KEY_FILE="${key_file}" sops --decrypt --input-type dotenv --output-type dotenv "${ENC_FILE}" > /tmp/env.decrypted
          shred -u "${key_file}" || rm -f "${key_file}"
          chmod 600 /tmp/env.decrypted

      - name: Deploy on remote host (Swarm/SOPS orchestration)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          DEPLOY_PROJECT_DIR: ${{ secrets.DEPLOY_PROJECT_DIR }}
          DEPLOY_REF: ${{ inputs.declared_deploy_ref != '' && inputs.declared_deploy_ref || github.sha }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          ORCHESTRATION_SCRIPT_PATH: ${{ inputs.orchestration_script_path }}
          INFRA_REPO_PATH: ${{ inputs.infra_repo_path }}
          RESOLVED_IMAGE_DIGEST: ${{ inputs.resolved_image_digest }}
          DEPLOYMENT_RELEASE_TAG: ${{ inputs.deployment_release_tag }}
          APPROVAL_CONTEXT: ${{ inputs.approval_context }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          ssh_port="${SERVER_SSH_PORT:-22}"
          local_sops_key_file="/tmp/sops-age-key.remote"
          printf '%s\n' "${SOPS_AGE_KEY}" | tr -d '\r' > "${local_sops_key_file}"
          chmod 600 "${local_sops_key_file}"
          trap 'shred -u "${local_sops_key_file}" 2>/dev/null || rm -f "${local_sops_key_file}"' EXIT

          scp -P "${ssh_port}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            /tmp/env.decrypted \
            "${SERVER_USER}@${SERVER_HOST}:/tmp/env.decrypted"

          scp -P "${ssh_port}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${local_sops_key_file}" \
            "${SERVER_USER}@${SERVER_HOST}:/tmp/sops-age-key.txt"

          ssh -p "${ssh_port}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${SERVER_USER}@${SERVER_HOST}" \
            "DEPLOY_REF='${DEPLOY_REF}' DEPLOY_PROJECT_DIR='${DEPLOY_PROJECT_DIR}' ENVIRONMENT_NAME='${ENVIRONMENT_NAME}' ORCHESTRATION_SCRIPT_PATH='${ORCHESTRATION_SCRIPT_PATH}' INFRA_REPO_PATH='${INFRA_REPO_PATH}' RESOLVED_IMAGE_DIGEST='${RESOLVED_IMAGE_DIGEST}' DEPLOYMENT_RELEASE_TAG='${DEPLOYMENT_RELEASE_TAG}' APPROVAL_CONTEXT='${APPROVAL_CONTEXT}' bash -s" <<'EOF'
          set -euo pipefail
          trap 'rm -f /tmp/env.decrypted /tmp/deploy-manifest.yml /tmp/sops-age-key.txt' EXIT

          if [[ -z "${DEPLOY_PROJECT_DIR:-}" ]]; then
            echo "ERROR: DEPLOY_PROJECT_DIR is empty"
            exit 1
          fi
          if [[ ! -d "${DEPLOY_PROJECT_DIR}/.git" ]]; then
            echo "ERROR: DEPLOY_PROJECT_DIR is not a git repository: ${DEPLOY_PROJECT_DIR}"
            exit 1
          fi
          if [[ ! -f /tmp/env.decrypted ]]; then
            echo "ERROR: /tmp/env.decrypted not found on remote host"
            exit 1
          fi
          if [[ -n "${RESOLVED_IMAGE_DIGEST:-}" ]]; then
            if [[ ! "${RESOLVED_IMAGE_DIGEST}" =~ ^[^[:space:]@]+@sha256:[a-f0-9]{64}$ ]]; then
              echo "ERROR: resolved_image_digest must be an immutable sha256 reference"
              exit 1
            fi
            updated_env=$(mktemp /tmp/env.decrypted.XXXXXX)
            awk -v digest="${RESOLVED_IMAGE_DIGEST}" '
              /^SMTP2GRAPH_IMAGE_DIGEST=/ { if (!replaced) { print "SMTP2GRAPH_IMAGE_DIGEST=" digest; replaced=1 }; next }
              { print }
              END { if (!replaced) print "SMTP2GRAPH_IMAGE_DIGEST=" digest }
            ' /tmp/env.decrypted > "${updated_env}"
            chmod 600 "${updated_env}"
            mv "${updated_env}" /tmp/env.decrypted
          fi

          if ! git config --global --get-all safe.directory 2>/dev/null | grep -Fxq "${DEPLOY_PROJECT_DIR}"; then
            git config --global --add safe.directory "${DEPLOY_PROJECT_DIR}"
          fi

          run_repo_git() {
            if [[ -w "${DEPLOY_PROJECT_DIR}" && -w "${DEPLOY_PROJECT_DIR}/.git" ]]; then
              git -C "${DEPLOY_PROJECT_DIR}" "$@"
              return
            fi

            repo_owner_uid="$(stat -c '%u' "${DEPLOY_PROJECT_DIR}")"
            if ! command -v sudo >/dev/null 2>&1; then
              echo "ERROR: deploy user cannot write to ${DEPLOY_PROJECT_DIR} or .git, and sudo is not available"
              exit 1
            fi
            if ! sudo -n -u "#${repo_owner_uid}" test -w "${DEPLOY_PROJECT_DIR}" ||
               ! sudo -n -u "#${repo_owner_uid}" test -w "${DEPLOY_PROJECT_DIR}/.git"; then
              echo "ERROR: deploy user cannot write to repo and cannot run git as repo owner via passwordless sudo"
              echo "HINT: allow passwordless sudo for git operations as repo owner, or fix ownership/ACL for ${DEPLOY_PROJECT_DIR}"
              exit 1
            fi

            sudo -n -u "#${repo_owner_uid}" git -C "${DEPLOY_PROJECT_DIR}" "$@"
          }

          run_repo_git fetch --all --prune
          run_repo_git checkout "${DEPLOY_REF}"

          cd "${DEPLOY_PROJECT_DIR}"

          if [[ -n "${ORCHESTRATION_SCRIPT_PATH:-}" && -f "${ORCHESTRATION_SCRIPT_PATH}" ]]; then
            chmod +x "${ORCHESTRATION_SCRIPT_PATH}" || true
            echo "Running orchestration script in swarm mode: ${ORCHESTRATION_SCRIPT_PATH}"
            ORCHESTRATOR_MODE=swarm \
            ORCHESTRATOR_ENV_FILE=/tmp/env.decrypted \
            ENVIRONMENT_NAME="${ENVIRONMENT_NAME}" \
            DEPLOYMENT_RELEASE_TAG="${DEPLOYMENT_RELEASE_TAG}" \
            DECLARED_DEPLOY_REF="${DEPLOY_REF}" \
            APPROVAL_CONTEXT="${APPROVAL_CONTEXT}" \
            INFRA_REPO_PATH="${INFRA_REPO_PATH}" \
            bash "${ORCHESTRATION_SCRIPT_PATH}"
          else
            echo "No orchestration script found at '${ORCHESTRATION_SCRIPT_PATH:-}', fallback to default swarm deploy"

            compose_file=""
            if [[ -f "docker-compose.yaml" ]]; then
              compose_file="docker-compose.yaml"
            elif [[ -f "docker-compose.yml" ]]; then
              compose_file="docker-compose.yml"
            else
              echo "ERROR: No docker-compose file found in ${DEPLOY_PROJECT_DIR}"
              exit 1
            fi

            if [[ ! -f "docker-compose.swarm.yml" ]]; then
              echo "ERROR: docker-compose.swarm.yml not found for swarm deploy"
              exit 1
            fi

            stack_name="$(basename "${DEPLOY_PROJECT_DIR}")"

            docker compose --env-file /tmp/env.decrypted \
              -f "${compose_file}" \
              -f docker-compose.swarm.yml \
              config > /tmp/deploy-manifest.yml

            sed -i '/^name:/d' /tmp/deploy-manifest.yml
            docker stack deploy -c /tmp/deploy-manifest.yml "${stack_name}"
          fi
          EOF

      - name: Cleanup decrypted env file
        if: always()
        run: |
          set -euo pipefail
          if [[ -f /tmp/env.decrypted ]]; then
            shred -u /tmp/env.decrypted || rm -f /tmp/env.decrypted
          fi
